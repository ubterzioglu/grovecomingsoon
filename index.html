<script type="application/ld+json">

<body>
<canvas id="canopy" class="canopy" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<main class="shell">
  <div class="stage">
    <div class="block">

      <h1 class="mark" data-reveal>
        <img src="assets/grove-logo.png" alt="Grove Software" width="1250" height="310" fetchpriority="high">

      <hr class="rule" data-reveal>

      <p class="eyebrow" data-reveal>Software Development</p>

      <p class="headline" data-reveal>Coming soon</p>

      <p class="lede" data-reveal>
        We build custom software, web and mobile products for European
        businesses &mdash; German business expertise, engineering from our
        team in T&uuml;rkiye.
      </p>

      <nav class="links" aria-label="Grove Software elsewhere" data-reveal>
        <a class="link" href="https://www.linkedin.com/company/grovesoftware/"
           target="_blank" rel="me noopener" aria-label="Grove Software on LinkedIn">
          <svg class="link-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect x="2" y="9" width="4" height="12"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
          <span>LinkedIn</span>
        </a>

        <a class="link" href="https://www.instagram.com/grovesoftwaredev"
           target="_blank" rel="me noopener" aria-label="Grove Software on Instagram">
          <svg class="link-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5.5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.6" cy="6.4" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
          <span>Instagram</span>
        </a>
      </nav>

    </div>
  </div>

  <footer class="foot" data-reveal>
    <span>&copy; 2026 Grove Software</span>
    <span class="foot-where">Germany &middot; T&uuml;rkiye</span>
  </footer>
</main>

<script src="canopy.js" defer></script>

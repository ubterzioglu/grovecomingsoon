server {
    # Container-internal port, reached by Coolify's proxy over the Docker
    # network — never published to the host, so it cannot collide with
    # anything else running on the server. Must match "Ports Exposes".
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # These are declared once, at server level, and must stay that way: an
    # add_header anywhere in a location block discards every header inherited
    # from here. Caching below is therefore set with `expires`, never add_header.
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "DENY"                            always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    # Coolify's container health check hits this.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Filenames carry no content hash, so the HTML always revalidates.
    location = /index.html {
        expires -1;
    }

    location /assets/ {
        expires 30d;
    }

    location ~* \.(css|js)$ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Single page: anything unmatched is the page itself.
    error_page 404 /index.html;
}
